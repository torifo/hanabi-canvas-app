name: hanabi-canvas

services:
  web:
    image: ghcr.io/${GHCR_OWNER}/hanabi-canvas-web:${IMAGE_TAG}
    container_name: hanabi-canvas-web
    restart: unless-stopped
    depends_on:
      realtime:
        condition: service_started
    environment:
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - default
      - global-proxy-network
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  realtime:
    image: ghcr.io/${GHCR_OWNER}/hanabi-canvas-realtime:${IMAGE_TAG}
    container_name: hanabi-canvas-realtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      ALLOWED_ORIGIN: https://${DOMAIN}
    expose:
      - "8080"
    networks:
      - default
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    internal: true
  global-proxy-network:
    external: true
