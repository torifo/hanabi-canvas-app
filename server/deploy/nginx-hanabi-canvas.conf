# Replace hanabi.example.com and certificate paths. If the app already owns
# this HTTPS vhost, merge only this exact `location = /ws` block into it.
server {
  listen 443 ssl http2;
  server_name hanabi.example.com;

  ssl_certificate /etc/letsencrypt/live/hanabi.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hanabi.example.com/privkey.pem;

  location = /ws {
    # Origin is intentionally checked here as the public edge boundary.
    if ($http_origin != "https://hanabi.example.com") { return 403; }

    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
